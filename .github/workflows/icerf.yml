name: Build i Cerf

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: icerf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Apply i Cerf patch
      run: |
        if [ -f icerf-patch.zip ]; then unzip -o icerf-patch.zip -x "Feather/*.swift"; fi
        python3 icerf_patch.py

    - name: Ensure submodules
      run: |
        if [ ! -f Zsign/Package.swift ]; then
          rm -rf Zsign
          git clone --depth 1 -b package https://github.com/khcrysalis/Zsign-Package Zsign
        fi
        if [ -z "$(ls -A IDeviceKitten 2>/dev/null)" ]; then
          rm -rf IDeviceKitten
          git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten
        fi

    - name: Select Xcode
      run: |
        if [ -d /Applications/Xcode_26.3.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
        else
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
        fi

    - name: Build
      run: make iphoneos

    - name: Repack IPA (plain zip)
      run: |
        rm -rf repack && mkdir repack && cd repack
        unzip -q ../packages/iCerf.ipa
        rm -rf __MACOSX
        find . -name ".DS_Store" -delete
        rm -f ../packages/iCerf.ipa
        zip -qry ../packages/iCerf.ipa Payload

    - name: Publish release (direct .ipa download)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: i Cerf build ${{ github.run_number }}
        files: packages/iCerf.ipa
