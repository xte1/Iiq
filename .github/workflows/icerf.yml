name: Build i Cerf

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: icerf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Apply i Cerf patch (if present)
      run: |
        if [ -f icerf-patch.zip ]; then unzip -o icerf-patch.zip; fi

    - name: Ensure submodules
      run: |
        if [ ! -f Zsign/Package.swift ]; then
          rm -rf Zsign
          git clone --depth 1 -b package https://github.com/khcrysalis/Zsign-Package Zsign
        fi
        if [ -z "$(ls -A IDeviceKitten 2>/dev/null)" ]; then
          rm -rf IDeviceKitten
          git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten
        fi
        echo "--- Zsign"; ls Zsign | head
        echo "--- IDeviceKitten"; ls IDeviceKitten | head

    - name: Select Xcode
      run: |
        if [ -d /Applications/Xcode_26.3.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
        else
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
        fi
        xcodebuild -version
        ls -d /Applications/Xcode*.app

    - name: Resolve packages
      run: |
        xcodebuild -resolvePackageDependencies -project Feather.xcodeproj -scheme Feather 2>&1 | tail -40 || true

    - name: Build
      run: make iphoneos

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: iCerf-IPA
        path: packages/iCerf.ipa
