name: Build i Cerf

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: icerf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Apply i Cerf patch (if present)
      run: |
        if [ -f icerf-patch.zip ]; then unzip -o icerf-patch.zip; fi

    - name: Ensure submodules
      run: |
        if [ ! -f Zsign/Package.swift ]; then
          rm -rf Zsign
          git clone --depth 1 -b package https://github.com/khcrysalis/Zsign-Package Zsign
        fi
        if [ -z "$(ls -A IDeviceKitten 2>/dev/null)" ]; then
          rm -rf IDeviceKitten
          git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten
        fi

    - name: Select Xcode 26
      run: |
        XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
        xcodebuild -version

    - name: Build
      run: make iphoneos

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: iCerf-IPA
        path: packages/iCerf.ipa
