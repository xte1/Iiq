name: Build i Cerf

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: icerf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    - name: Fetch exact dependencies
      run: |
        fetch_at() {
          dir="$1"; url="$2"; sha="$3"
          rm -rf "$dir"; mkdir "$dir"
          (cd "$dir" && git init -q && git remote add origin "$url" \
            && git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD)
        }
        fetch_at Zsign https://github.com/khcrysalis/Zsign-Package c4ba9da4283031c07efa03bce42c4b8602d22e73
        fetch_at IDeviceKitten https://github.com/khcrysalis/IDeviceKit 837cf1e14d4875771dd5ee1b754a4c86215c5db3
        ls Zsign | head -5
        ls IDeviceKitten | head -5

    - name: Apply i Cerf patch
      run: |
        if [ -f icerf-patch.zip ]; then unzip -o icerf-patch.zip -x "Feather/*.swift"; fi
        python3 icerf_patch.py

    - name: Select Xcode
      run: |
        if [ -d /Applications/Xcode_26.3.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
        else
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
        fi
        xcodebuild -version

    - name: Build
      run: make iphoneos || (sleep 5 && make iphoneos)

    - name: Repack IPA (plain zip)
      run: |
        rm -rf repack && mkdir repack && cd repack
        unzip -q ../packages/iCerf.ipa
        rm -rf __MACOSX
        find . -name ".DS_Store" -delete
        rm -f ../packages/iCerf.ipa
        zip -qry ../packages/iCerf.ipa Payload

    - name: Publish release (direct .ipa download)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: i Cerf build ${{ github.run_number }}
        files: packages/iCerf.ipa
